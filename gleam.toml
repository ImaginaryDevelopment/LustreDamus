name = "lustre_damus"
version = "1.0.0"
target = "javascript"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "ImaginaryDevelopment", repo = "LustreDamus" }
# links = [{ title = "Website", href = "" }]
#
